<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile Link | TOP</title>

  <!-- CSSの読み込み -->
  <link rel="stylesheet" href="style.css">
    <!-- JavaScriptの読み込み -->
  <script src="script.js"></script>
</head>

<body>

  <!-- =========================
       ヘッダー
  ========================= -->
  <header class="header">

    <div class="header-holes" aria-hidden="true">
  <span></span>
  <span></span>
</div>

    <div class="header-inner">

 <!-- ヘッダーロゴ -->
<a href="index.html" class="header-logo">
  <img
    src="images/header-logo.png"
    alt="Profile Link"
    class="header-logo-image">
</a>
      <!-- ナビゲーション -->
      <nav class="nav" aria-label="メインメニュー">
        <a href="index.html" aria-current="page">TOP</a>
        <a href="all.html">PROFILE</a>
      </nav>

    </div>

  </header>


  <main>

    <!-- =========================
         メインビジュアル
    ========================= -->
    <section class="hero">
  <img
    src="images/hero-visual.png"
    alt="Profile Link｜みんなのことを、ちょっと知る。プロフィール帳を通して、みんなのことを知るきっかけに。"
    class="hero-image">
</section>


    <!-- =========================
         プロフィールサンプル
    ========================= -->
    <section class="samples" aria-labelledby="samples-title">

      <div class="samples-inner">

        <!-- セクションタイトル -->
        <div class="samples-heading">

          <div>
            <h2 id="samples-title" class="section-title">
              PROFILE SAMPLE
            </h2>

            <p class="section-description">
              プロフィールをちょっとのぞいてみよう！
            </p>
          </div>

          </div>

        
<!-- 横スクロールエリア -->
<div
  class="sample-track"
  tabindex="0"
  role="region"
  aria-label="プロフィールサンプル一覧">

  <!-- サンプル01：花子 -->
  <div class="sample-card sample-01">
    <img
      src="images/profile-hanako.png"
      alt="花子のプロフィール帳"
      class="sample-image">
  </div>

  <!-- サンプル02：太郎 -->
  <div class="sample-card sample-02">
    <img
      src="images/profile-taro.png"
      alt="太郎のプロフィール帳"
      class="sample-image">
  </div>

  <!-- サンプル03：みう -->
  <div class="sample-card sample-03">
<img
      src="images/profile-miu.png"
      alt="みうのプロフィール帳"
      class="sample-image">
  </div>

  <!-- サンプル04 -->
  <div class="sample-card sample-04">
    <div class="sample-placeholder">
      SAMPLE 04
    </div>
  </div>

  <!-- サンプル05 -->
  <div class="sample-card sample-05">
    <div class="sample-placeholder">
      SAMPLE 05
    </div>
  </div>

  <!-- サンプル06 -->
  <div class="sample-card sample-06">
    <div class="sample-placeholder">
      SAMPLE 06
    </div>
  </div>

</div>


<!-- プロフィール一覧へのボタン -->
<div class="samples-button">
  <a href="all.html" class="main-button">
    みんなのプロフィールを見る →
  </a>
</div>

<!-- samples-inner を閉じる -->
</div>

<!-- samples セクションを閉じる -->
</section>


  </main>


  <!-- =========================
       フッター
  ========================= -->
  <footer class="footer">

    <p class="copyright">
      © Profile Link
    </p>

  </footer>

</body>
</html>
